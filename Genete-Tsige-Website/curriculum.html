    const langLabelsMap = { am: "🇪🇹 አማርኛ", en: "🇬🇧 English", om: "🌳 Afaan Oromoo", ti: "🏔️ ትግርኛ" };

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function changeLanguage(langCode) {
      localStorage.setItem("preferredLang", langCode);
      currentLanguage = langCode;
      document.documentElement.lang = currentLanguage;
      
      const labelEl = document.getElementById("currentLangLabel");
      if (labelEl) labelEl.textContent = langLabelsMap[currentLanguage] || "🇪🇹 አማርኛ";

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.dataset.i18n;
        const value = translations[currentLanguage]?.[key];
        if (typeof value === "string") element.textContent = value;
      });

      renderTable();
    }

    function setGrade(grade) {
      activeGrade = grade;
      updateGradeButtons();
      renderTable();
    }

    function updateGradeButtons() {
      ['g1', 'g2', 'g3', 'g4'].forEach(g => {
        const btn = document.getElementById(`btnGrade${g.toUpperCase()}`);
        if (!btn) return;
        if (g === activeGrade) {
          btn.className = "px-4 py-2.5 rounded-xl text-xs font-bold transition bg-amber-100 text-rose-950 border border-amber-300 shadow-sm";
        } else {
          btn.className = "px-4 py-2.5 rounded-xl text-xs font-bold transition bg-stone-50 text-gray-700 hover:bg-stone-100 border border-stone-200";
        }
      });
    }

    function renderTable() {
      const tbody = document.getElementById("curriculumTableBody");
      const titleEl = document.getElementById("displayProgramTitle");
      const badgeEl = document.getElementById("shiftBadge");
      
      if (!tbody) return;
      tbody.innerHTML = "";

      const shiftNames = {
        am: { day: "☀️ የቀን መርሃ-ግብር", evening: "🌙 የማታ መርሃ-ግብር", distance: "📡 የርቀት ትምህርት" },
        en: { day: "☀️ Day Program", evening: "🌙 Evening Program", distance: "📡 Distance Learning" },
        om: { day: "☀️ Sagantaa Guyyaa", evening: "🌙 Sagantaa Galgalaa", distance: "📡 Barnoota Fageenyaa" },
        ti: { day: "☀️ መደብ መዓልቲ", evening: "🌙 መደብ ምሸት", distance: "📡 ትምህርቲ ርሕቀት" }
      };

      if (badgeEl) {
        badgeEl.textContent = shiftNames[currentLanguage]?.[activeShift] || shiftNames['am'][activeShift];
      }

      if (titleEl) {
        const gradeText = gradeLabels[currentLanguage]?.[activeGrade] || gradeLabels['am'][activeGrade];
        titleEl.textContent = gradeText;
      }

      const list = curriculumData[activeShift]?.[activeGrade] || [];
      list.forEach((item, index) => {
        const row = document.createElement("tr");
        row.className = "hover:bg-stone-50 border-b border-gray-100 transition";
        
        const subj = item.subject[currentLanguage] || item.subject['am'];
        const tm = item.time[currentLanguage] || item.time['am'];
        
        const sched = scheduleTranslations[currentLanguage]?.[item.schedule] || item.schedule;
        const tcher = teacherTranslations[currentLanguage]?.[item.teacher] || item.teacher;
        const stat = statusTranslations[currentLanguage]?.[item.status] || item.status;

        row.innerHTML = `
          <td class="p-4 font-bold text-rose-950">${index + 1}</td>
          <td class="p-4 font-semibold">${subj}</td>
          <td class="p-4 text-amber-800 font-semibold">${tm}</td>
          <td class="p-4 text-gray-600">${sched}</td>
          <td class="p-4 font-medium text-rose-950">${tcher}</td>
          <td class="p-4">${stat}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function exportCurriculumExcel() {
      let csv = 'No,Subject,ModuleOrTime,Schedule,Teacher,Status\n';
      const list = curriculumData[activeShift]?.[activeGrade] || [];
      list.forEach((row, idx) => {
        const subj = row.subject[currentLanguage] || row.subject['am'];
        const tm = row.time[currentLanguage] || row.time['am'];
        const sched = scheduleTranslations[currentLanguage]?.[row.schedule] || row.schedule;
        const tcher = teacherTranslations[currentLanguage]?.[row.teacher] || row.teacher;
        const stat = statusTranslations[currentLanguage]?.[row.status] || row.status;
        csv += `"${idx + 1}","${subj}","${tm}","${sched}","${tcher}","${stat}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Curriculum_${activeShift}_${activeGrade}_${currentLanguage}.csv`;
      link.click();
    }

    document.addEventListener("DOMContentLoaded", () => {
      const urlShift = getQueryParam("shift");
      if (urlShift && ['day', 'evening', 'distance'].includes(urlShift)) {
        activeShift = urlShift;
      }

      updateGradeButtons();
      const savedLang = localStorage.getItem("preferredLang") || "am";
      changeLanguage(savedLang);
    });
  </script>
