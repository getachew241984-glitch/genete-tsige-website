    function checkStudentResult(e) {
      if (e) e.preventDefault();
      
      const inputId = document.getElementById("studentIdInput").value.trim().toUpperCase();
      const display = document.getElementById("resultDisplay");
      
      if (!inputId) return;

      const lang = localStorage.getItem("preferredLang") || "am";
      const t = translations[lang] || translations.am;

      display.classList.remove("hidden");
      display.innerHTML = `<div class="text-center text-amber-800 font-bold py-3">⏳ ${t.searching}</div>`;

      Papa.parse(LIVE_CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          const rows = results.data;
          let foundStudent = null;

          for (let i = 0; i < rows.length; i++) {
            const cols = rows[i];
            if (cols[0] && cols[0].trim().toUpperCase() === inputId) {
              foundStudent = {
                id: cols[0].trim(),
                sem1: {
                  john: cols[1] || "-",
                  geez: cols[2] || "-",
                  christian: cols[3] || "-",
                  research: cols[4] || "-",
                  hymn: cols[5] || "-",
                  total: cols[6] || "0",
                  avg: cols[7] || "0.00"
                },
                sem2: {
                  john: cols[8] || "-",
                  geez: cols[9] || "-",
                  christian: cols[10] || "-",
                  research: cols[11] || "-",
                  hymn: cols[12] || "-",
                  total: cols[13] || "0",
                  avg: cols[14] || "0.00"
                },
                overall: {
                  avg: cols[15] || cols[7] || "0.00",
                  status: cols[16] || "ተዘዋውሯል/ለች"
                }
              };
              break;
            }
          }

          if (!foundStudent) {
            foundStudent = masterStudentData.find(item => item.id.trim().toUpperCase() === inputId);
          }

          currentStudentMatch = foundStudent;

    function changeLanguage(langCode) {
      if (!translations[langCode]) return;
      localStorage.setItem("preferredLang", langCode);
      document.documentElement.lang = langCode;

      const labelEl = document.getElementById("currentLangLabel");
      if (labelEl) labelEl.textContent = langLabelsMap[langCode] || "🇪🇹 አማርኛ";

      // Translate static data-i18n elements
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.dataset.i18n;
        const text = translations[langCode]?.[key];
        if (text) element.textContent = text;
      });

      // Re-render result card dynamically if a student is currently searched
      if (currentStudentMatch) {
        const inputId = document.getElementById("studentIdInput").value.trim().toUpperCase();
        renderResultCard(currentStudentMatch, inputId);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const inputField = document.getElementById("studentIdInput");
      if (inputField) {
        inputField.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            checkStudentResult();
          }
        });
      }

      const savedLang = localStorage.getItem("preferredLang") || "am";
      changeLanguage(savedLang);
    });
